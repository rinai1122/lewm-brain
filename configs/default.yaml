# Default configuration for the one-session, one-model end-to-end run.
# Stage notebooks load this file; resolved values are written next to
# every output artifact for reproducibility.

seed: 0

session_pick:
  session_type: brain_observatory_1.1
  required_areas: [VISp]
  any_higher_areas: [VISl, VISal, VISpm, VISam, VISrl]
  rule: max_good_units_in_visual_cortex
  # Filled in on first stage-1 run; leave null until then.
  session_id: null

unit_filter:
  # Allen defaults — see data_notes.md.
  isi_violations_max: 0.5
  amplitude_cutoff_max: 0.1
  presence_ratio_min: 0.9

stimulus:
  primary: natural_movie_one
  also: []  # natural_movie_three deferred — same code path, just slow
  frame_rate_hz: 30
  bin_width_s: null  # null => use 1 / frame_rate_hz

stage1:
  dataset_id: sungjiwang/lewm-brain-stage1
  dataset_title: lewm-brain stage 1 (Allen neural responses)

stage2:
  # Default slug used if a model entry doesn't pin its own dataset_id.
  dataset_id: sungjiwang/lewm-brain-stage2
  dataset_title: lewm-brain stage 2 (V-JEPA-2 features)
stage2_batch_size: 4

stage3:
  dataset_id: sungjiwang/lewm-brain-stage3
  dataset_title: lewm-brain stage 3 (ridge encoder)
  # Clip-based holdout (Schrimpf 2018 §2.3). Last test_frac of clips is
  # the test set; gap of split_gap_clips clips between train and test
  # guarantees no input-pixel overlap (sliding stride-1 means each clip
  # overlaps clip_frames-1 with its neighbor).
  test_frac: 0.20
  split_gap_clips: 64

heldout:
  policy: last_repeat   # one of {last_repeat, leave_one_out}

behavior_covariates:
  include_running_speed: true
  include_pupil: true
  mode: regressor       # one of {regressor, regress_out, none}

depth_pooling: pool_within_area  # one of {pool_within_area, by_layer}

models:
  - name: vjepa2_vitl
    family: jepa
    hf_id: facebook/vjepa2-vitl-fpc64-256
    clip_frames: 64
    clip_resolution: 256
    clip_window: sliding_stride_1
    # Block 16 of 24, last-tubelet spatial mean (256 tokens of 8192).
    # Global mean-pool gave CKA(pre, rand) ≈ 0.80, so we drop the
    # temporal axis from the pool to keep end-of-clip semantics.
    layer_index: 16
    pool: last_tubelet
    tubelet_size: 2
    dataset_id: sungjiwang/lewm-brain-stage2-l16-tt
    # Kaggle dataset titles are capped at 50 chars; keep this short.
    dataset_title: lewm-brain stage 2 L16 TT pretrained
  - name: vjepa2_vitl_random
    family: random_init
    hf_id: facebook/vjepa2-vitl-fpc64-256
    clip_frames: 64
    clip_resolution: 256
    clip_window: sliding_stride_1
    init: random
    layer_index: 16
    pool: last_tubelet
    tubelet_size: 2
    dataset_id: sungjiwang/lewm-brain-stage2-l16-tt-rand
    dataset_title: lewm-brain stage 2 L16 TT random init
  # VideoMAE-large: pixel-level video MAE — the natural baseline (a) for
  # the JEPA vs pixel-prediction contrast. ViT-L scale matches V-JEPA-2.
  # Native preset is 16 frames, 224². Don't try to force 64 frames here;
  # the positional embeddings are learned for 16. tubelet_size=2 like
  # V-JEPA-2, and num_hidden_layers=24 so layer_index=16 is the same
  # ≈2/3-depth midpoint we use for the JEPA pull.
  - name: videomae_large
    family: pixel_predictive
    hf_id: MCG-NJU/videomae-large
    clip_frames: 16
    clip_resolution: 224
    clip_window: sliding_stride_1
    layer_index: 16
    pool: last_tubelet
    tubelet_size: 2
    dataset_id: sungjiwang/lewm-brain-stage2-vmae-l16-tt
    dataset_title: lewm-brain stage 2 VMAE L16 TT pretrained
    stage3_dataset_id: sungjiwang/lewm-brain-stage3-vmae
    stage3_dataset_title: lewm-brain stage 3 (videomae)
    stage4_dataset_id: sungjiwang/lewm-brain-stage4-vmae
    stage4_dataset_title: lewm-brain stage 4 (videomae)
  - name: videomae_large_random
    family: random_init
    hf_id: MCG-NJU/videomae-large
    clip_frames: 16
    clip_resolution: 224
    clip_window: sliding_stride_1
    init: random
    layer_index: 16
    pool: last_tubelet
    tubelet_size: 2
    dataset_id: sungjiwang/lewm-brain-stage2-vmae-l16-tt-rand
    dataset_title: lewm-brain stage 2 VMAE L16 TT random init
    stage3_dataset_id: sungjiwang/lewm-brain-stage3-vmae-rand
    stage3_dataset_title: lewm-brain stage 3 (videomae rand)
    stage4_dataset_id: sungjiwang/lewm-brain-stage4-vmae-rand
    stage4_dataset_title: lewm-brain stage 4 (videomae rand)
  # DINOv2-large: image-only self-distillation SSL on LVD-142M, the (b)
  # contrastive-SSL family stand-in. Strict-contrastive video backbones
  # at ViT-L scale (CVRL, VideoMoCo) have no clean HF release; DINOv2 is
  # the canonical non-generative-SSL ViT in current neuro-encoding work.
  # Caveat documented in progress.md (2026-05-03 contrastive entry).
  # ViT-L/14, hidden_size=1024 — matches V-JEPA-2 ViT-L and VideoMAE-large
  # so Stage 3/4 numbers are at matched feature scale. layer_index=16 for
  # the same ≈2/3-depth midpoint we use elsewhere; pool=cls is DINOv2's
  # canonical pooled rep. Image-mode: per-frame, no clip window.
  - name: dinov2_vitl
    family: contrastive_ssl
    hf_id: facebook/dinov2-large
    frame_mode: image
    clip_resolution: 224
    layer_index: 16
    pool: cls
    dataset_id: sungjiwang/lewm-brain-stage2-dino-l16
    dataset_title: lewm-brain stage 2 DINO L16 pretrained
    stage3_dataset_id: sungjiwang/lewm-brain-stage3-dino
    stage3_dataset_title: lewm-brain stage 3 (dinov2)
    stage4_dataset_id: sungjiwang/lewm-brain-stage4-dino
    stage4_dataset_title: lewm-brain stage 4 (dinov2)
  - name: dinov2_vitl_random
    family: random_init
    hf_id: facebook/dinov2-large
    frame_mode: image
    clip_resolution: 224
    init: random
    layer_index: 16
    pool: cls
    dataset_id: sungjiwang/lewm-brain-stage2-dino-l16-rand
    dataset_title: lewm-brain stage 2 DINO L16 random init
    stage3_dataset_id: sungjiwang/lewm-brain-stage3-dino-rand
    stage3_dataset_title: lewm-brain stage 3 (dinov2 rand)
    stage4_dataset_id: sungjiwang/lewm-brain-stage4-dino-rand
    stage4_dataset_title: lewm-brain stage 4 (dinov2 rand)

encoder:
  model: ridge
  alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  cv: leave_one_repeat_out

straightening:
  method: henaff_2021
  spaces: [pixel, model, neural]
  # Hénaff 2021 §Methods: 11-frame natural-movie clips, mean per-step
  # angle within each clip is the reported per-stimulus number.
  window_frames: 11

stage4:
  dataset_id: sungjiwang/lewm-brain-stage4
  dataset_title: lewm-brain stage 4 (straightening)
